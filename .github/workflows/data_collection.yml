name: Hourly WoW Market Collector

on:
  # 정기 수집 종료 (포트폴리오 정리). 비공개 저장소의 Actions 는 무료 한도가
  # 월 2,000분이라, 이 스케줄을 남긴 채 비공개로 전환하면 한도를 초과한다.
  # 필요하면 workflow_dispatch 로 수동 실행한다.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Collection Script
        env:
          WOW_CLIENT_ID: ${{ secrets.WOW_CLIENT_ID }}
          WOW_CLIENT_SECRET: ${{ secrets.WOW_CLIENT_SECRET }}
        run: python scripts/collector.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Market-Bot"
          git config --global user.email "bot@github.com"
          git add data/market_history.csv data/market_volume.csv data/item_dict.csv
          TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
          git commit -m "Update market data [$TIMESTAMP]" || exit 0
          git push
